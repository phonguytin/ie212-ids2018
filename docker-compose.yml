# Speed + serving layers (Lambda architecture). Batch layer: Google Colab or the `batch` service.
#   docker compose up -d --build            -> Kafka, MongoDB, Spark (1 master + 2 workers), scorer, web
#   docker compose run --rm batch python3 -m ids.etl ...   -> run batch jobs locally instead of Colab
x-spark: &spark
  image: ids2018-spark:4.0.1
  build: { context: ., dockerfile: docker/spark/Dockerfile }
  environment: &spark-env
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: ids
    SPARK_NO_DAEMONIZE: "true"
  volumes:
    - ./src:/opt/ids/src:ro
    - ./models:/opt/ids/models:ro
    - ./work:/opt/ids/work

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create",
                 "--if-not-exists", "--topic", "flows", "--partitions", "4", "--replication-factor", "1"]
    restart: "no"

  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8080:8080", "7077:7077"]

  spark-worker-1: &worker
    <<: *spark
    hostname: spark-worker-1
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "--webui-port", "8081", "spark://spark-master:7077"]
    ports: ["8081:8081"]

  spark-worker-2:
    <<: *worker
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "--webui-port", "8082", "spark://spark-master:7077"]
    ports: ["8082:8082"]

  scorer:
    <<: *spark
    hostname: scorer
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      spark-worker-1: { condition: service_started }
      spark-worker-2: { condition: service_started }
    environment:
      <<: *spark-env
      KAFKA_BOOTSTRAP: kafka:9092
      SPARK_MASTER: spark://spark-master:7077
      MODELS_DIR: /opt/ids/models
      CHECKPOINT_DIR: /opt/ids/work/checkpoints/scorer
    command: ["/opt/spark/bin/spark-submit", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=scorer", "--conf", "spark.driver.bindAddress=0.0.0.0",
              "--conf", "spark.executor.memory=1500m", "--conf", "spark.executor.cores=2",
              "--conf", "spark.cores.max=4", "--conf", "spark.driver.memory=2g",
              "--conf", "spark.executorEnv.MONGO_URI=mongodb://mongo:27017",
              "--conf", "spark.executorEnv.MONGO_DB=ids",
              "--conf", "spark.executorEnv.PYTHONPATH=/opt/ids/src:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip",
              "/opt/ids/src/ids/stream_scorer.py"]
    ports: ["4040:4040"]
    restart: on-failure

  api:
    build: { context: ., dockerfile: web/Dockerfile }
    image: ids2018-web:1.0
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MONGO_URI: mongodb://mongo:27017
      MODELS_DIR: /opt/ids/models
      RESULTS_DIR: /opt/ids/results
      DATA_DIR: /data
    volumes:
      - ./models:/opt/ids/models:ro
      - ./results:/opt/ids/results:ro
      - ./data:/data:ro
      - ./web/app:/opt/ids/web/app:ro
      - ./src:/opt/ids/src:ro
    ports: ["8000:8000"]

  # Batch layer run locally (alternative to Colab). Not started by `up`.
  batch:
    <<: *spark
    profiles: ["batch"]
    environment:
      <<: *spark-env
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-10g}
    volumes:
      - ./:/opt/ids
    working_dir: /opt/ids
    entrypoint: []

volumes:
  mongo-data:
